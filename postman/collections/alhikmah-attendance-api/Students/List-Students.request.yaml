$kind: http-request
name: List Students
method: GET
url: '{{base_url}}/api/v1/students'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
queryParams:
  - key: class_id
    value: '{{class_id}}'
    disabled: true
  - key: search
    value: ''
    disabled: true
  - key: is_active
    value: 'true'
    disabled: true
  - key: page
    value: '1'
  - key: limit
    value: '10'
