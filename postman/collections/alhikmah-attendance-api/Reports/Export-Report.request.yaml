$kind: http-request
name: Export Report
method: POST
url: '{{base_url}}/api/v1/reports/export'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "report_type": "harian",
      "class_id": "{{class_id}}",
      "date": "2025-05-28",
      "month": "",
      "semester": "",
      "academic_year": "",
      "format": "excel"
    }
