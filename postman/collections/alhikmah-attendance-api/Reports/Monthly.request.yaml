$kind: http-request
name: Monthly Report
method: GET
url: '{{base_url}}/api/v1/reports/monthly'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
queryParams:
  - key: class_id
    value: '{{class_id}}'
  - key: month
    value: '2025-05'
  - key: force_refresh
    value: 'false'
    disabled: true
