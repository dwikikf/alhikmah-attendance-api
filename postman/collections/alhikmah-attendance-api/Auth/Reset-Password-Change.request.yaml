$kind: http-request
name: Reset Password Change
method: POST
url: '{{base_url}}/api/v1/auth/reset-password/change'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "old_password": "oldpassword123",
      "new_password": "newpassword123"
    }
