$kind: http-request
name: Logout
method: POST
url: '{{base_url}}/api/v1/auth/logout'
order: 2000
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        pm.environment.unset("auth_token");
        console.log("Token cleared from environment.");
      }
