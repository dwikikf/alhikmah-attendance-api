$kind: http-request
name: Reset Password Confirm
method: POST
url: '{{base_url}}/api/v1/auth/reset-password/confirm'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "reset-token-here",
      "new_password": "newpassword123"
    }
