$kind: http-request
name: List Classes
method: GET
url: '{{base_url}}/api/v1/classes'
order: 1000
params:
  - key: academic_year
    value: '2024/2025'
    description: 'Filter by academic year (e.g. 2024/2025).'
    disabled: true
  - key: page
    value: '1'
    description: Page number for pagination.
    disabled: true
  - key: limit
    value: '20'
    description: Number of results per page.
    disabled: true
