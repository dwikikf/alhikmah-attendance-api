$kind: http-request
name: List Classes
method: GET
url: '{{base_url}}/api/v1/classes'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
queryParams:
  - key: academic_year
    value: '2024/2025'
    disabled: true
  - key: page
    value: '1'
  - key: limit
    value: '20'
